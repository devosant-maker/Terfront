<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b16" />
    <title>iPad Online Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="brand">
          <div class="logo">⌘</div>
          <div>
            <h1>iPad Online Terminal</h1>
            <p>Terminal pribadi berbasis WebSocket untuk server Linux.</p>
          </div>
        </div>

        <div class="form-grid">
          <label>
            <span>WebSocket URL</span>
            <input id="wsUrl" type="text" autocomplete="off" spellcheck="false" />
          </label>

          <label>
            <span>Token</span>
            <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Masukkan token backend" />
          </label>

          <div class="actions">
            <button id="connectBtn">Connect</button>
            <button id="disconnectBtn" class="secondary">Disconnect</button>
            <button id="clearBtn" class="ghost">Clear</button>
          </div>
        </div>

        <div id="status" class="status disconnected">Disconnected</div>
      </section>

      <section class="terminal-shell">
        <div class="terminal-topbar">
          <div class="dots"><span></span><span></span><span></span></div>
          <strong>remote bash</strong>
        </div>
        <div id="terminal"></div>
        <div id="fallbackTerminal" class="fallback hidden">
          <pre id="fallbackOutput"></pre>
          <div class="fallbackInputRow">
            <span>$</span>
            <input id="fallbackInput" type="text" autocomplete="off" spellcheck="false" placeholder="Ketik command lalu Enter" />
          </div>
        </div>
      </section>
    </main>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
